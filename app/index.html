<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown to DOCX</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <div class="panel input-panel">
          <div class="panel-header">
            <div class="header-row">
              <h1 data-i18n="appTitle">Markdown to DOCX</h1>
              <label class="language-picker" for="languageSelect">
                <span data-i18n="languageLabel">Language</span>
                <select id="languageSelect" aria-label="Language">
                  <option value="zh-CN">简体中文</option>
                  <option value="en-US">English</option>
                </select>
              </label>
            </div>

            <div class="tab-list" role="tablist" aria-label="Convert mode" data-i18n-attr="aria-label:tabsAria">
              <button class="tab-button active" type="button" data-tab="file" data-i18n="tabFile">MD 文件</button>
              <button class="tab-button" type="button" data-tab="paste" data-i18n="tabPaste">粘贴内容</button>
            </div>
          </div>

          <section class="tab-page active" data-page="file">
            <div class="field-group">
              <label for="fileInputPath" data-i18n="fileInputLabel">Markdown 文件</label>
              <div class="path-row">
                <input id="fileInputPath" type="text" readonly data-i18n-placeholder="fileInputPlaceholder" placeholder="选择 .md 文件" />
                <button id="chooseFileInput" type="button" data-i18n="browse">浏览</button>
              </div>
            </div>

            <div class="field-group">
              <label for="fileOutputPath" data-i18n="outputLabel">DOCX 输出</label>
              <div class="path-row">
                <input id="fileOutputPath" type="text" data-i18n-placeholder="outputPlaceholder" placeholder="输出路径" />
                <button id="chooseFileOutput" type="button" data-i18n="saveAs">另存为</button>
              </div>
            </div>

            <div class="metadata-grid">
              <div class="field-group">
                <label for="fileTitle" data-i18n="titleLabel">标题</label>
                <input id="fileTitle" type="text" data-i18n-placeholder="titlePlaceholder" placeholder="可选文档标题" />
              </div>
              <div class="field-group">
                <label for="fileAuthor" data-i18n="authorLabel">作者</label>
                <input id="fileAuthor" type="text" data-i18n-placeholder="authorPlaceholder" placeholder="可选作者" />
              </div>
            </div>

            <div class="actions">
              <button id="convertFile" class="primary" type="button" data-i18n="convert">转换</button>
              <button class="show-output" type="button" disabled data-i18n="openFolder">打开目录</button>
            </div>
          </section>

          <section class="tab-page" data-page="paste">
            <div class="field-group">
              <label for="markdownText" data-i18n="pasteInputLabel">Markdown 内容</label>
              <textarea id="markdownText" spellcheck="false" data-i18n-placeholder="pasteInputPlaceholder" placeholder="# 标题&#10;&#10;在这里粘贴 Markdown..."></textarea>
            </div>

            <div class="field-group">
              <label for="pasteOutputPath" data-i18n="outputLabel">DOCX 输出</label>
              <div class="path-row">
                <input id="pasteOutputPath" type="text" data-i18n-placeholder="outputPlaceholder" placeholder="输出路径" />
                <button id="choosePasteOutput" type="button" data-i18n="saveAs">另存为</button>
              </div>
            </div>

            <div class="metadata-grid">
              <div class="field-group">
                <label for="pasteTitle" data-i18n="titleLabel">标题</label>
                <input id="pasteTitle" type="text" data-i18n-placeholder="titlePlaceholder" placeholder="可选文档标题" />
              </div>
              <div class="field-group">
                <label for="pasteAuthor" data-i18n="authorLabel">作者</label>
                <input id="pasteAuthor" type="text" data-i18n-placeholder="authorPlaceholder" placeholder="可选作者" />
              </div>
            </div>

            <div class="actions">
              <button id="convertPaste" class="primary" type="button" data-i18n="convert">转换</button>
              <button class="show-output" type="button" disabled data-i18n="openFolder">打开目录</button>
            </div>
          </section>
        </div>

        <aside class="panel status-panel">
          <h2 data-i18n="statusTitle">状态</h2>
          <div id="statusBadge" class="status-badge idle">Ready</div>
          <pre id="statusLog"></pre>

          <div class="feature-list">
            <div>
              <span data-i18n="featureFile">文件</span>
              <strong>.md -> .docx</strong>
            </div>
            <div>
              <span data-i18n="featurePaste">粘贴</span>
              <strong>text -> .docx</strong>
            </div>
            <div>
              <span data-i18n="featureMath">公式</span>
              <strong>OMML</strong>
            </div>
            <div>
              <span data-i18n="featureTables">表格</span>
              <strong>GFM</strong>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
